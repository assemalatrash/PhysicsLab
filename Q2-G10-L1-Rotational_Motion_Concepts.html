<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G10-L1: Rotational Motion Interactive Lab</title>
  <style>
    /* =========================================================================
       DESIGN TOKENS & BASE STYLES (Crisp White Light Physics Lab Theme)
       ========================================================================= */
    :root {
      --bg-base: #ffffff;
      --bg-surface: #ffffff;
      --bg-elevated: #f8fafc;
      --bg-input: #f8fafc;
      --border: #e2e8f0;
      --border-light: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --cyan: #0284c7;
      --cyan-dark: #0369a1;
      --cyan-soft: #f0f9ff;
      --cyan-glow: rgba(2, 132, 199, 0.18);

      --emerald: #059669;
      --emerald-dark: #047857;
      --emerald-soft: #ecfdf5;
      --emerald-glow: rgba(5, 150, 105, 0.18);

      --amber: #d97706;
      --amber-dark: #b45309;
      --amber-soft: #fffbeb;
      --amber-glow: rgba(217, 119, 6, 0.18);

      --rose: #e11d48;
      --rose-dark: #be123c;
      --rose-soft: #fff1f2;
      --rose-glow: rgba(225, 29, 72, 0.18);

      --violet: #7c3aed;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.14);
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      background-image: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================================================
       TOP NAVIGATION BAR
       ========================================================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .topbar-inner {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e0f2fe, #d1fae5);
      border: 1px solid #bae6fd;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .brand-sub {
      margin: 0;
      font-size: 0.78rem;
      color: var(--cyan);
      font-weight: 600;
    }

    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .student-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .student-box:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
      background: #ffffff;
    }

    .student-box label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 700;
      white-space: nowrap;
    }

    .student-box input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      width: 140px;
      outline: none;
    }

    .student-box input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .progress-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
    }

    .progress-track {
      width: 90px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--emerald));
      transition: width 0.4s ease;
    }

    .score-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--emerald);
      white-space: nowrap;
    }

    /* =========================================================================
       BUTTONS
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      user-select: none;
      min-height: 38px;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.24);
    }
    .btn-cyan:hover:not(:disabled) {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.32);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.24);
    }
    .btn-emerald:hover:not(:disabled) {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .btn-amber {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.26);
    }
    .btn-amber:hover:not(:disabled) {
      background: linear-gradient(135deg, #fbbf24, #d97706);
    }

    .btn-ghost {
      background: #ffffff;
      color: var(--text-primary);
      border-color: var(--border-light);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-elevated);
      border-color: var(--cyan);
      color: var(--cyan-dark);
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 0.78rem;
      min-height: 32px;
    }

    /* =========================================================================
       STAGE NAVIGATION TABS
       ========================================================================= */
    .app-container {
      max-width: 1260px;
      margin: 0 auto;
      padding: 18px 20px 48px;
    }

    .stage-nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stage-tab {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .stage-tab:hover {
      border-color: var(--border-light);
      background: var(--bg-elevated);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .stage-tab.active {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--cyan-dark);
      box-shadow: 0 0 0 1px rgba(2, 132, 199, 0.25), 0 6px 16px rgba(2, 132, 199, 0.12);
    }

    .stage-tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stage-tab-pts {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .stage-tab.completed .stage-tab-pts {
      background: var(--emerald-soft);
      border-color: #a7f3d0;
      color: var(--emerald);
      font-weight: 700;
    }

    .stage-tab-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }

    /* =========================================================================
       STAGE PANELS & CARDS
       ========================================================================= */
    .stage-panel {
      display: none;
      animation: fadeIn 0.28s ease;
    }
    .stage-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-md);
    }

    .stage-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .stage-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-formula-pill {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      background: var(--cyan-soft);
      border: 1px solid #bae6fd;
      color: var(--cyan-dark);
    }

    .lab-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .canvas-shell {
      position: relative;
      width: 100%;
      height: 390px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    .canvas-shell canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    .canvas-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .hud-chip {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    /* =========================================================================
       CONTROLS, INPUTS & FEEDBACK BOXES
       ========================================================================= */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mode-switch {
      display: inline-flex;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--cyan);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
    }

    .mission-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .mission-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: var(--amber-dark);
      margin-bottom: 8px;
    }

    .mission-prompt {
      margin: 0 0 12px;
      font-size: 0.96rem;
      color: var(--text-primary);
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .num-input-wrap {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex: 1;
      min-width: 160px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .num-input-wrap:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-glow);
    }

    .num-input-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 700;
      padding: 10px 12px;
      outline: none;
    }

    .unit-tag {
      padding: 0 12px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan-dark);
      background: var(--cyan-soft);
      height: 100%;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--border);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .slider-label span:last-child {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--cyan-dark);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .feedback-box {
      border-radius: var(--radius-md
