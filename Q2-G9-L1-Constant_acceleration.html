<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 9 Physics Interactive Lab: Constant Acceleration</title>
  <style>
    /* =====================================================================
       DESIGN TOKENS & RESET (100% Self-Contained, Crisp White Light Lab UI)
       ===================================================================== */
    :root {
      --bg-deep: #ffffff;
      --bg-panel: #ffffff;
      --bg-card: #f8fafc;
      --bg-card-hover: #f1f5f9;
      --border: #cbd5e1;
      --border-light: #e2e8f0;
      --border-glow: rgba(2, 132, 199, 0.25);

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;

      --cyan: #0284c7;
      --cyan-dark: #0369a1;
      --cyan-bg: rgba(2, 132, 199, 0.1);
      --emerald: #059669;
      --emerald-bg: #ecfdf5;
      --coral: #e11d48;
      --coral-bg: #fff1f2;
      --amber: #d97706;
      --amber-bg: #fffbeb;
      --purple: #7c3aed;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --font-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Crisp white background with ultra-subtle light-gray lab grid & pastel glows */
    body {
      background-image:
        radial-gradient(circle at 12% 8%, rgba(14, 165, 233, 0.06), transparent 38%),
        radial-gradient(circle at 88% 90%, rgba(16, 185, 129, 0.06), transparent 40%),
        linear-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input, select {
      font-family: inherit;
    }

    /* =====================================================================
       TOP HEADER BAR & NAVIGATION
       ===================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      padding: 12px 18px;
    }

    .header-top {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0284c7, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .brand-sub {
      margin: 0;
      font-size: 0.82rem;
      color: var(--cyan);
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
